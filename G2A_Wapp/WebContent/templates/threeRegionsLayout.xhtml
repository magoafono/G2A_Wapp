<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <link rel="stylesheet" type="text/css"
              href="#{request.contextPath}/javax.faces.resource/my-style.css.xhtml?ln=css&amp;v=#{msg['build.revision']}" />
        <h:outputScript name="jquery/jquery.js" library="primefaces" />
        <h:outputScript name="jquery/jquery-plugins.js" library="primefaces" />
        <title><ui:insert name="title">Default title</ui:insert></title>
    </h:head>

    <h:body>
        <!-- Layout a 3 regioni in CSS flexbox (sostituisce p:layout/p:layoutUnit,
             fragili/rimossi nelle versioni recenti di PrimeFaces). Id e classi-tema
             preservati per compatibilita' con JS e aspetto. -->
        <div class="g2a-layout">

            <div id="northLayoutUnit" class="g2a-north ui-widget">
                <div class="g2a-unit-header ui-widget-header">
                    <span class="g2a-unit-title">Greek into Arabic Web Application<ui:fragment rendered="#{loginBean.loggedIn}"> &#8212; #{collectionBean.label}</ui:fragment></span>
                    <span class="g2a-build-version-wrap"><ui:include src="/templates/buildVersion.xhtml" /></span>
                </div>
                <div class="g2a-unit-content ui-widget-content">
                    <ui:insert name="header">CL:Header</ui:insert>
                </div>
            </div>

            <div id="centerLayoutUnit" class="g2a-center ui-widget ui-widget-content">
                <ui:insert name="body">CL:body</ui:insert>
            </div>

            <div id="southLayoutUnit" class="g2a-south ui-widget ui-widget-content">
                <ui:insert name="footer">CL:footer</ui:insert>
            </div>

        </div>
    </h:body>

</html>
