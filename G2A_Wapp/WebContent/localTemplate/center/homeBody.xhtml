<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<div class="g2a-hero-wrap">
		<div class="g2a-hero-card">
			<div class="g2a-hero-bar">Greek into Arabic Web Application</div>
			<div class="g2a-hero-body">
				<p class="g2a-hero-title">Greek into Arabic</p>
				<p class="g2a-hero-sub">Philosophical Concepts and Linguistic Bridges</p>
				<hr class="g2a-hero-rule" />
				<p class="g2a-hero-app">Web application for literary computing</p>
				<div class="g2a-hero-logos">
					<a href="http://www.ilc.cnr.it" target="_blank"
						title="Istituto di Linguistica Computazionale Antonio Zampolli"> <img
						src="#{resource['images/ILC_Logo-2022.png']}" class="g2a-logo-ilc"
						alt="Istituto di Linguistica Computazionale" /></a>
					<a href="http://www.cnr.it" target="_blank"
						title="Consiglio Nazionale delle Ricerche"> <img
						src="#{resource['images/logoCNR-2022.png']}" class="g2a-logo-cnr"
						alt="Consiglio Nazionale delle Ricerche" /></a>
					<a href="http://erc.europa.eu/" target="_blank"
						title="European Research Council"> <img
						src="#{resource['images/erc-logo-2025.png']}" class="g2a-logo-erc"
						alt="European Research Council" /></a>
				</div>
			</div>
		</div>
	</div>
</ui:composition>
