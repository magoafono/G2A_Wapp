                                        <p:selectOneMenu id="ar_operator" effect="none"

                                    <p:column headerText="Type" style="text-align:center;">
                                        <p:selectOneMenu effect="none" id="ar_type_2"
                                                         value="#{searchViewBean.arSb.type[1]}"
                                                         style="text-align:left;">
                                            <f:selectItems value="#{searchViewBean.arItemType}"
                                                           var="tipo" itemLabel="#{tipo.left}"
                                                           itemValue="#{tipo.right}" />
                                        </p:selectOneMenu>
                                    </p:column>
                                    <p:column style="text-align:center;">
                                        <p:inputText id="ar_word_2" styleClass="arabic" size="10" placeholder="#{searchViewBean.arSb.word[1]}"

                                    </p:column>

                                        <p:selectOneMenu id="ar_pos_2" effect="none" height="500"
                                                         value="#{searchViewBean.arSb.pos[1]}"
                                                         panelStyle="width:300px" style="text-align:left; width:180px">
                                            <f:selectItems value="#{searchViewBean.arItemPos}" var="pos"

                                        <p:selectOneMenu effect="none" id="ar_type_3"

                                        </p:selectOneMenu>
                                    </p:column>
                                    <p:column style="text-align:center;">
                                        <p:inputText id="ar_word_3" styleClass="arabic" size="10" placeholder="#{searchViewBean.arSb.word[2]}"

                                    </p:column>
                                    <p:column style="text-align:center;">

        <!-- RESULTS -->

        <div id="lu_south" class="g2a-sub-south ui-widget-content">
            <h:form id="searchResultFormId" >
                <p:dataTable id="results_dt" var="alink" scrollable="true" 
                             scrollHeight="300"
                             widgetVar="resultsTable"
                             selection="#{parallelViewBean.selectedResultViewEntity}"
                             rendered="#{not empty searchViewBean.searchResult}"
                             value="#{searchViewBean.searchResult}" selectionMode="single"
                             rowKey="#{not empty alink.linkId ? alink.linkId : alink.hashCode()}">
                    <p:ajax event="rowSelect" update=":menuForm" />

                    <p:column sortBy="#{alink.grPericopeId}" width="8%"
                              headerText="Greek Ref">
                        <h:outputText value="#{alink.grPericopeInfo}" />
                    </p:column>

                    <p:column style="white-space:normal" headerText="Greek Pericope">
                        <p:outputPanel layout="block" styleClass="greek"
                                       style="padding-right:0px;font-size:#{loginBean.greekFontSize}">
                            <ui:repeat value="#{alink.greekTVE}" var="gr">
                                <ui:fragment rendered="#{gr.text eq '&#x21b2;'}">
                                    <h:outputText value="&#x0020;" />
                                </ui:fragment>
                                <ui:fragment rendered="#{gr.text ne '&#x21b2;'}">
                                    <h:outputText value="#{gr.text}"
                                                  styleClass="#{gr.color == 1  ? 'highlight': ''} greek" />
                                    <h:outputText value="&#xa0;" />
                                </ui:fragment>
                            </ui:repeat>
                        </p:outputPanel>
                    </p:column>
                    <p:column style="white-space:normal" headerText="Arabic Pericope">
                        <p:outputPanel layout="block" styleClass="arabic"
                                       style="padding-right:0px;font-size:#{loginBean.arabicFontSize}">
                            <ui:repeat value="#{alink.arabicTVE}" var="ar">
                                <ui:fragment rendered="#{ar.text eq '&#x21b3;'}">
                                    <h:outputText value="&#x0020;" />
                                </ui:fragment>
                                <ui:fragment rendered="#{ar.text ne '&#x21b3;'}">
                                    <h:outputText value="#{ar.text}"
                                                  styleClass="#{ar.color == 1  ? 'highlight': ''}" />
                                    <h:outputText value="&#xa0;" />
                                </ui:fragment>
                            </ui:repeat>
                        </p:outputPanel>
                    </p:column>
                    <p:column sortBy="#{alink.arPericopeId}"
                              headerText="Arabic Ref" width="10%">
                        <h:outputText value="#{alink.arPericopeInfo}" />
                    </p:column>

                    <f:facet name="footer">
                        <div class="resultFooter">
                            <h:outputText styleClass="resultCount"
                                          value="Results (#{fn:length(searchViewBean.searchResult)})" />
                            <p:commandButton id="download_btn" icon="ui-icon-arrowthick-1-s"
                                             action="#{searchViewBean.fileDownloadView()}" ajax="false"
                                             value="Download Results"
                                             rendered="#{searchViewBean.downloadableResult != null}">
                                <p:fileDownload value="#{searchViewBean.downloadableResult}" />
                            </p:commandButton>
                        </div>
                    </f:facet>
                </p:dataTable>


            </h:form>
        </div>
    </div>

    <p:dialog id="seachDialogId" modal="true" showHeader="false"
              widgetVar="ajaxWaitDialog" draggable="false" closable="false"
              resizable="false">
        <h:graphicImage value="#{resource['images/load.gif']}" />
    </p:dialog>

    <!-- Scale-to-fit del form di ricerca: lo rimpicciolisce (zoom) finche'
         sta nel viewport, mantenendo i 3 pannelli in fila. Ricalcolato su
         load, resize e dopo ogni richiesta AJAX. -->
    <script type="text/javascript">
        //<![CDATA[
        // Adatta l'altezza del corpo dei risultati allo spazio di #lu_south:
        // scorre solo il result set e l'header resta fisso. Va chiamata DOPO lo
        // zoom del form, altrimenti misura un'altezza non ancora assestata.
        function g2aFitSearchResults() {
            try {
                var lu = document.getElementById('lu_south');
                var dt = document.querySelector('#searchResultFormId .ui-datatable');
                if (!lu || !dt) { return; }
                var body = dt.querySelector('.ui-datatable-scrollable-body');
                if (!body) { return; }
                var cs = getComputedStyle(lu);
                var padBottom = parseFloat(cs.paddingBottom) || 0;
                var borderBottom = parseFloat(cs.borderBottomWidth) || 0;
                var lr = lu.getBoundingClientRect();
                var dr = dt.getBoundingClientRect();
                var contentBottom = lr.bottom - borderBottom - padBottom;
                var fixed = 0;
                ['.ui-datatable-header', '.ui-datatable-scrollable-header',
                 '.ui-datatable-scrollable-footer', '.ui-datatable-footer',
                 '.ui-paginator-top', '.ui-paginator-bottom'].forEach(function(sel) {
                    var e = dt.querySelector(sel);
                    if (e) { fixed += e.offsetHeight; }
                });
                var h = contentBottom - dr.top - fixed;
                if (h < 120) { h = 120; }
                h = Math.round(h) + 'px';
                body.style.height = h;
                body.style.maxHeight = h;
            } catch (e) {}
        }
        function g2aFitSearch() {
            var el = document.getElementById('gr_form:search_pg');
            if (!el) return;
            el.style.zoom = '1';
            var natural = el.scrollWidth;
            var avail = document.documentElement.clientWidth - 24;
            var s = (natural > 0) ? Math.min(1, avail / natural) : 1;
            el.style.zoom = (s > 0 ? s : 1);
            // Dopo lo zoom le altezze cambiano: riadatta subito i risultati.
            g2aFitSearchResults();
        }
        function g2aFixResultTextSelection() {
            try { if (window.PrimeFaces && PF('resultsTable')) { PF('resultsTable').cfg.disabledTextSelection = false; } } catch (e) {}
        }
        // PF puo' ridimensionare dopo di noi: ripetiamo il fit tra qualche ms.
        function g2aReflowResults() {
            g2aFitSearch();
            setTimeout(g2aFitSearchResults, 60);
            setTimeout(g2aFitSearchResults, 300);
        }
        window.addEventListener('resize', g2aReflowResults);
        window.addEventListener('load', function () { setTimeout(g2aFitSearch, 50); g2aFitSearchResults(); });
        if (document.readyState !== 'loading') { setTimeout(g2aFitSearch, 50); g2aFitSearchResults(); }
        else { document.addEventListener('DOMContentLoaded', function () { setTimeout(g2aFitSearch, 50); g2aFitSearchResults(); }); }
        if (window.jQuery) { jQuery(document).on('pfAjaxComplete', function () { setTimeout(g2aFitSearch, 50); g2aFixResultTextSelection(); setTimeout(g2aFitSearchResults, 80); }); }
        g2aFixResultTextSelection();
        //]]>
    </script>

</ui:composition>
