# Configurazione Dependabot - aggiornamenti controllati.
#
# Contesto: stack fissato a Java 11 + namespace javax (PrimeFaces 14, JSF 2.3,
# eXist 5.2 monolitico, XML-RPC 3.1.3). Le major che portano a Jakarta o a
# Java 17 rompono la build, quindi sono bloccate: restano ammesse solo le
# patch/minor automatiche.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/G2A_Wapp"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    ignore:
      # Mai major automatiche: Java 11 + javax restano il vincolo.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Dipendenze legacy/bloccate: nessun aggiornamento automatico.
      - dependency-name: "org.apache.xmlrpc:xmlrpc-client"
      - dependency-name: "org.apache.xmlrpc:xmlrpc-common"
      - dependency-name: "org.exist-db:exist-core"
      - dependency-name: "org.ow2.asm:asm"
      - dependency-name: "org.primefaces.themes:all-themes"
      # Linee javax esplicite (difesa in profondita', oltre alla regola major).
      - dependency-name: "org.primefaces:primefaces"
        versions: [">= 15"]
      - dependency-name: "org.primefaces.extensions:primefaces-extensions"
        versions: [">= 15"]
      - dependency-name: "org.glassfish:jakarta.faces"
        versions: [">= 3"]
      - dependency-name: "org.jboss.weld.servlet:weld-servlet-shaded"
        versions: [">= 4"]
      - dependency-name: "javax.servlet:javax.servlet-api"
      - dependency-name: "javax.servlet:jstl"
      - dependency-name: "org.slf4j:slf4j-api"
        versions: [">= 2"]
      - dependency-name: "org.slf4j:slf4j-ext"
        versions: [">= 2"]
      - dependency-name: "org.apache.jena:jena-arq"
        versions: [">= 5"]
